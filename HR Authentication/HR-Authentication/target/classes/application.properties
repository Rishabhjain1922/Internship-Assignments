spring.application.name=HR-Portal

# ✅ Use a file-based H2 database to persist data across restarts
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ✅ Fix for Hibernate Dialect issue
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ✅ Ensure Hibernate does not drop data
spring.jpa.hibernate.ddl-auto=update

# ✅ Enable H2 Console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session Settings
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=HR_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# CORS Settings
spring.mvc.cors.allowed-origins=http://localhost:8080
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
