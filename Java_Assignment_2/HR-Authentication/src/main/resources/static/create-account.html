<!DOCTYPE html>
<html>
<head>
    <title>Create HR Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="container login-container">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="text-center mb-4">Create HR Account</h2>
            <form id="createAccountForm">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Full Name" id="name" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Username" id="newUsername" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Password" id="newPassword" required>
                </div>
                <div class="mb-3">
                    <input type="tel" class="form-control" placeholder="Phone Number" id="phone">
                </div>
                <button class="btn btn-primary w-100">Create Account</button>
            </form>
            <div class="text-center mt-3">
                <a href="/index.html" class="text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
